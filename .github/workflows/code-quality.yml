name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: HTML code quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run static quality checks
        run: python3 scripts/check_quality.py

      - name: Verify workflow files are valid YAML
        run: python3 -c "import yaml,glob;[yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')];print('PASS: workflow YAML is valid')"

      - name: Summary
        if: always()
        run: echo "Code quality job finished with status ${{ job.status }}"
